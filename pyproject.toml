[project]
name = "membership-management"
version = "0.1.0"
description = "Church membership management API: membership applications, members, small groups and small-group reports"
readme = "README.md"
authors = [
    { name = "Luis Palacios", email = "lrpalaciosdev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
membership-management = "membership_management:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.uv.workspace]
members = [
    "src/membership_management/api",
]
