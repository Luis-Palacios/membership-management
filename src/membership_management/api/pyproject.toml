[project]
name = "membership-management-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "limits>=5.8.0",
    "pyjwt[crypto]>=2.10.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.141.1",
]

[tool.fastapi]
entrypoint="main:app"
